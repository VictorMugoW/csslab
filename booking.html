<!DOCTYPE html>
<html>
<head>
    <title>Book Space Flight</title>
    <link rel="stylesheet" href="csslab.css">
</head>

<body>

<header>
    <h1>🛰️ Book Your Space Trip</h1>
    <p>Complete the form below to request your space adventure.</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="destinations.html">Destinations</a>
    <a href="booking.html">Booking</a>
    <a href="gallery.html">Gallery</a>
</nav>

<main>

<form id="booking-form" onsubmit="validateBookingForm(event)">

    <!-- Error message -->
    <p id="form-error"
       style="display: none; color: red; font-weight: bold;">
    </p>


    <fieldset>

        <legend>Your Information</legend>

        <label for="name">Full Name:</label>

        <input
            type="text"
            id="name"
            name="name"
            required
        >


        <label for="email">Email:</label>

        <input
            type="email"
            id="email"
            name="email"
            required
        >


        <label for="phone">Phone:</label>

        <input
            type="tel"
            id="phone"
            name="phone"
        >

    </fieldset>


    <fieldset>

        <legend>Trip Details</legend>

        <label for="destination">
            Choose Destination:
        </label>

        <select
            id="destination"
            name="destination"
            required
        >

            <option value="">
                -- Select a destination --
            </option>

            <option value="moon">
                Moon Hotel ($450k)
            </option>

            <option value="mars">
                Mars Camp ($1.2M)
            </option>

            <option value="orbit">
                Orbit Lounge ($125k)
            </option>

        </select>


        <label for="people">
            Number of People:
        </label>

        <input
            type="number"
            id="people"
            name="people"
            min="1"
            max="6"
            value="1"
        >


        <label for="date">
            Preferred Date:
        </label>

        <input
            type="date"
            id="date"
            name="date"
        >

    </fieldset>


    <fieldset>

        <legend>Extras</legend>

        <label class="choice">
            <input
                type="checkbox"
                name="training"
                value="yes"
            >
            Zero-G training (+$5k)
        </label>


        <label class="choice">
            <input
                type="checkbox"
                name="photo"
                value="yes"
            >
            Space suit photo (+$2k)
        </label>


        <label class="choice">
            <input
                type="checkbox"
                name="insurance"
                value="yes"
            >
            Travel insurance (+$8k)
        </label>

    </fieldset>


    <fieldset>

        <legend>Class</legend>

        <label class="choice">
            <input
                type="radio"
                name="class"
                value="economy"
            >
            Economy (shared)
        </label>


        <label class="choice">
            <input
                type="radio"
                name="class"
                value="business"
            >
            Business (private pod)
        </label>


        <label class="choice">
            <input
                type="radio"
                name="class"
                value="first"
            >
            First class (suite)
        </label>

    </fieldset>


    <fieldset>

        <legend>Special Requests</legend>

        <label for="requests">
            Tell us about any special needs:
        </label>

        <textarea
            id="requests"
            name="requests"
            rows="5"
            placeholder="Any allergies or needs?"
        ></textarea>

    </fieldset>


    <button type="submit">
        Submit Booking
    </button>


    <button type="reset">
        Clear Form
    </button>


    <p>
        Estimated price:
        <output name="price">
            Will be calculated
        </output>
    </p>

</form>

</main>


<footer>

    <p>
        We will send a confirmation email within 2 days.
    </p>

    <p>
        Space Tourism - Student Project
    </p>

</footer>



<script src="script.js"></script>

</body>
</html>
